---
version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5.0
  shellcheck: circleci/shellcheck@3.1

filters: &filters
  tags:
    only: /.*/

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          # Read the exact workspace archive later used for inline injection.
          post-steps:
            - run:
                name: Verify the actual injection archive preserves the exit code
                command: bash .circleci/verify-packed-orb.sh dist/orb_source.tar.gz injection
            - run:
                name: Run the 2.0.0 self-test for the injection pack
                command: >-
                  bash .circleci/test-compare-baseline.sh injection
                  /tmp/ansible-lint-pack-evidence 2.0.0
            - run:
                name: Compare the injection pack with the 1.1.0 baseline and six adopted changes
                environment:
                  PACK_PIPELINE_ID: << pipeline.id >>
                command: bash .circleci/verify-packed-baseline.sh dist/orb_source.tar.gz injection
            - run:
                name: Verify the actual injection archive holds this commit's install command
                command: bash .circleci/verify-packed-install.sh dist/orb_source.tar.gz injection
            - store_artifacts:
                path: /tmp/ansible-lint-pack-evidence
                destination: packed-orb-structure
          filters: *filters
      - orb-tools/review:
          orb_name: ansible-lint
          post-steps:
            - run:
                name: Verify the RC010 result for this candidate
                when: always
                environment:
                  REVIEW_PIPELINE_ID: << pipeline.id >>
                command: python3 .circleci/verify-rc010.py /tmp/orb_dev_kit/review
            - store_artifacts:
                path: /tmp/orb_dev_kit/review
                destination: naming-review
          filters: *filters
      - shellcheck/check:
          exclude: SC2196
          filters: *filters
      # Inject this commit's packed Orb; no dev publish or publishing context.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: ansible-lint
          inject_orb: true
          config_path: .circleci/test-deploy.yml
          requires:
            - orb-tools/lint
            - orb-tools/review
            - orb-tools/pack
            - shellcheck/check
          filters: *filters
