---
version: 2.1
orbs:
  # orb-tools/continue injects this commit's packed Orb as "ansible-lint".
  orb-tools: circleci/orb-tools@12.5.0

filters: &filters
  tags:
    only: /.*/

commands:
  prepare-integration:
    parameters:
      case:
        type: string
      image-lock:
        type: string
        default: image-lock.json
    steps:
      - checkout:
          path: /tmp/ansible-lint-orb-source
      - run:
          name: Prepare this commit's fixture and image evidence
          command: |
            python3 /tmp/ansible-lint-orb-source/.circleci/record-evidence.py prepare /tmp/ansible-lint-orb-source "<< parameters.image-lock >>"
            python3 /tmp/ansible-lint-orb-source/.circleci/integration-test.py setup /tmp/ansible-lint-orb-source "<< parameters.case >>"
      - run:
          name: Record the local fixture source revision
          command: python3 /tmp/ansible-lint-ci-evidence/record-evidence.py worktree /tmp/ansible-lint-orb-source
  verify-integration:
    steps:
      - run:
          name: Verify fixture integrity and actual installed role revisions
          command: python3 /tmp/ansible-lint-orb-source/.circleci/integration-test.py verify
  collect-ci-evidence:
    parameters:
      dependencies:
        type: boolean
        default: true
    steps:
      - when:
          condition: << parameters.dependencies >>
          steps:
            - run:
                name: Show image and repository evidence
                when: always
                command: python3 /tmp/ansible-lint-ci-evidence/record-evidence.py report
      - unless:
          condition: << parameters.dependencies >>
          steps:
            - run:
                name: Show evidence for a test without role dependencies
                when: always
                command: python3 /tmp/ansible-lint-ci-evidence/record-evidence.py report no-dependencies
      - store_artifacts:
          path: /tmp/ansible-lint-ci-evidence
          destination: image-and-repository-evidence
      - store_artifacts:
          path: /tmp/ansible-lint-integration-evidence
          destination: integration-evidence

jobs:
  normal-test:
    executor: ansible-lint/default
    working_directory: /tmp/ansible-lint-case
    steps:
      - prepare-integration:
          case: normal
      # Both public parameters deliberately use their default false values.
      - ansible-lint/execute
      - verify-integration
      - collect-ci-evidence:
          dependencies: false
  role-test:
    executor: ansible-lint/default
    working_directory: /tmp/ansible-lint-case
    steps:
      - prepare-integration:
          case: role
      - ansible-lint/execute:
          molecule-role-test: true
      - verify-integration
      - collect-ci-evidence
  playbook-test:
    executor: ansible-lint/default
    working_directory: /tmp/ansible-lint-case
    steps:
      - prepare-integration:
          case: playbook
      - ansible-lint/execute:
          molecule-playbook-test: true
      - verify-integration
      - collect-ci-evidence
  negative-test:
    executor: ansible-lint/default
    working_directory: /tmp/ansible-lint-case
    steps:
      - prepare-integration:
          case: negative
      - run:
          name: Self-test the exact capture and invocation verifier used below
          command: |
            python3 /tmp/ansible-lint-orb-source/.circleci/test-negative-test.py 2>&1 | tee /tmp/negative-self-test.log
      - run:
          name: Resolve the real linter and initialize a fresh negative-test observer
          command: |
            python3 /tmp/ansible-lint-orb-source/.circleci/negative-test.py prepare /tmp/ansible-lint-orb-source/tests/negative-expected.json /tmp/ansible-lint-negative-evidence
      - ansible-lint/execute
      - run:
          name: Require the exact real violation and one no-argument lint invocation
          command: python3 /tmp/ansible-lint-orb-source/.circleci/negative-test.py verify /tmp/ansible-lint-negative-evidence
      - verify-integration
      - collect-ci-evidence:
          dependencies: false
      - store_artifacts:
          path: /tmp/ansible-lint-negative-evidence
          destination: negative-evidence
      - store_artifacts:
          path: /tmp/negative-self-test.log
          destination: negative-self-test.log
  resource-class-test:
    executor:
      name: ansible-lint/default
      resource_class: medium
    working_directory: /tmp/ansible-lint-case
    steps:
      - prepare-integration:
          case: resource-class
      - ansible-lint/execute:
          molecule-playbook-test: true
      - verify-integration
      - collect-ci-evidence
  custom-image-test:
    executor:
      name: ansible-lint/default
      # Verified separate linux/amd64 image: 26.1.1-py3.14 at selection time.
      image: ghcr.io/docker-images-mamono210/circleci-executors/ansible-lint@sha256:4ea7fe7ebbe7fd06bd5a7fc61b8931c3303a11c9bd4eb06431a810f5914b8718
    working_directory: /tmp/ansible-lint-case
    steps:
      - prepare-integration:
          case: custom-image
          image-lock: tests/custom-image-lock.json
      - ansible-lint/execute:
          molecule-playbook-test: true
      - verify-integration
      - collect-ci-evidence

workflows:
  test-deploy:
    jobs:
      - normal-test:
          filters: *filters
      - role-test:
          filters: *filters
      - playbook-test:
          filters: *filters
      - negative-test:
          filters: *filters
      - resource-class-test:
          filters: *filters
      - custom-image-test:
          filters: *filters
      - orb-tools/pack:
          # This workflow has its own workspace. Inspect its actual publish archive.
          post-steps:
            - run:
                name: Verify the actual publication archive preserves the exit code
                command: bash .circleci/verify-packed-orb.sh dist/orb_source.tar.gz publication
            - store_artifacts:
                path: /tmp/ansible-lint-pack-evidence
                destination: packed-orb-structure
          filters: *filters
      - orb-tools/publish:
          orb_name: orbss/ansible-lint
          vcs_type: << pipeline.project.type >>
          pub_type: production
          circleci_token: CIRCLE_TOKEN
          enable_pr_comment: false
          requires:
            - orb-tools/pack
            - normal-test
            - role-test
            - playbook-test
            - negative-test
            - resource-class-test
            - custom-image-test
          # Only production publish uses the publishing context.
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
