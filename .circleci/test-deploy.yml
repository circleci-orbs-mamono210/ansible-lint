---
version: 2.1
orbs:
  # orb-tools/continue injects the packed Orb as "ansible-lint" here.
  # Validate the injected config, not this template on its own.
  orb-tools: circleci/orb-tools@12.5.0

filters: &filters
  tags:
    only: /.*/

commands:
  prepare-ci-evidence:
    parameters:
      source-directory:
        type: string
    steps:
      - run:
          name: Record image versions and prepare repository evidence
          command: >-
            python3 "<< parameters.source-directory >>/.circleci/record-evidence.py"
            prepare "<< parameters.source-directory >>"
  collect-ci-evidence:
    steps:
      - run:
          name: Show repository revisions used by the integration test
          when: always
          command: python3 /tmp/ansible-lint-ci-evidence/record-evidence.py report
      - store_artifacts:
          path: /tmp/ansible-lint-ci-evidence
          destination: image-and-repository-evidence

jobs:
  playbook-test:
    executor: ansible-lint/default
    steps:
      - checkout:
          path: /tmp/ansible-lint-orb-source
      - prepare-ci-evidence:
          source-directory: /tmp/ansible-lint-orb-source
      - run:
          name: Checkout test repo
          command: |
            git clone https://github.com/ansible-playbooks-mamono210/wordpress_install.git .
            python3 /tmp/ansible-lint-ci-evidence/record-evidence.py worktree
      - ansible-lint/execute:
          molecule-playbook-test: true
      - collect-ci-evidence
  resource-class-test:
    executor:
      name: ansible-lint/default
      resource_class: medium
    steps:
      - checkout:
          path: /tmp/ansible-lint-orb-source
      - prepare-ci-evidence:
          source-directory: /tmp/ansible-lint-orb-source
      - run:
          name: Checkout test repo
          command: |
            git clone https://github.com/ansible-playbooks-mamono210/wordpress_install.git .
            python3 /tmp/ansible-lint-ci-evidence/record-evidence.py worktree
      - ansible-lint/execute:
          molecule-playbook-test: true
      - collect-ci-evidence
  role-test:
    executor: ansible-lint/default
    steps:
      - checkout
      - prepare-ci-evidence:
          source-directory: .
      - run:
          name: Prepare Ansible role files
          command: |
            mv test_resources/.ansible-lint .
            mv test_resources/defaults .
            mv test_resources/meta .
            mv test_resources/molecule .
            mv test_resources/tasks .
            python3 /tmp/ansible-lint-ci-evidence/record-evidence.py worktree
      - ansible-lint/execute:
          molecule-role-test: true
      - collect-ci-evidence
workflows:
  test-deploy:
    jobs:
      - playbook-test:
          filters: *filters
      - resource-class-test:
          filters: *filters
      - role-test:
          filters: *filters
      - orb-tools/pack:
          # This workflow creates its own workspace for production publish.
          # #5501 will inspect this job's archive in post-steps as well.
          filters: *filters
      - orb-tools/publish:
          orb_name: orbss/ansible-lint
          vcs_type: << pipeline.project.type >>
          pub_type: production
          circleci_token: CIRCLE_TOKEN
          enable_pr_comment: false
          requires:
            - orb-tools/pack
            - playbook-test
            - resource-class-test
            - role-test
          # Confirm this project's access and CIRCLE_TOKEN publishing scope.
          # Only production publish uses this context.
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
