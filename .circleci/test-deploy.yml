---
version: 2.1
orbs:
  # orb-tools/continue injects the packed Orb as "ansible-lint" here.
  # Validate the injected config, not this template on its own.
  orb-tools: circleci/orb-tools@12.5.0

filters: &filters
  tags:
    only: /.*/

jobs:
  playbook-test:
    executor: ansible-lint/default
    steps:
      - run:
          name: Checkout test repo
          command: |
            git clone https://github.com/ansible-playbooks-mamono210/wordpress_install.git .
      - ansible-lint/execute:
          molecule-playbook-test: true
  resource-class-test:
    executor:
      name: ansible-lint/default
      resource_class: medium
    steps:
      - run:
          name: Checkout test repo
          command: |
            git clone https://github.com/ansible-playbooks-mamono210/wordpress_install.git .
      - ansible-lint/execute:
          molecule-playbook-test: true
  role-test:
    executor: ansible-lint/default
    steps:
      - checkout
      - run:
          name: Prepare Ansible role files
          command: |
            mv test_resources/.ansible-lint .
            mv test_resources/defaults .
            mv test_resources/meta .
            mv test_resources/molecule .
            mv test_resources/tasks .
      - ansible-lint/execute:
          molecule-role-test: true
workflows:
  test-deploy:
    jobs:
      - playbook-test:
          filters: *filters
      - resource-class-test:
          filters: *filters
      - role-test:
          filters: *filters
      - orb-tools/pack:
          # This workflow creates its own workspace for production publish.
          # #5501 will inspect this job's archive in post-steps as well.
          filters: *filters
      - orb-tools/publish:
          orb_name: orbss/ansible-lint
          vcs_type: << pipeline.project.type >>
          pub_type: production
          circleci_token: CIRCLE_TOKEN
          enable_pr_comment: false
          requires:
            - orb-tools/pack
            - playbook-test
            - resource-class-test
            - role-test
          # Confirm this project's access and CIRCLE_TOKEN publishing scope.
          # Only production publish uses this context.
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
