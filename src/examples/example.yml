---
description: Execute Ansible lint
usage:
  version: 2.1
  orbs:
    ansible-lint: orbss/ansible-lint@1.0.0
  jobs:
    execute-ansible-lint:
      executor: ansible-lint/default
      steps:
        - checkout
        - ansible-lint/execute:
            molecule-role-test: true
  workflows:
    use-my-orb:
      jobs:
        - execute-ansible-lint
