---
description: >
  Lint an Ansible role repository with the default executor.
  Use this example after orbss/ansible-lint@2.0.0 is published.
usage:
  version: 2.1
  orbs:
    ansible-lint: orbss/ansible-lint@2.0.0
  jobs:
    execute-ansible-lint:
      executor: ansible-lint/default
      steps:
        - checkout
        - ansible-lint/execute:
            molecule_role_test: true
  workflows:
    use-my-orb:
      jobs:
        - execute-ansible-lint
