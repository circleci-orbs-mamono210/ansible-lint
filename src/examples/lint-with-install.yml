---
description: >
  Install the pinned tool set with the python executor, then lint the
  checked-out repository using the default execute parameters.
  Use this example after orbss/ansible-lint@2.0.0 is published.
usage:
  version: 2.1
  orbs:
    ansible-lint: orbss/ansible-lint@2.0.0
  jobs:
    lint-with-install:
      executor: ansible-lint/python
      steps:
        - checkout
        - ansible-lint/install
        - ansible-lint/execute
  workflows:
    lint:
      jobs:
        - lint-with-install
