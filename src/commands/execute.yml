---
description: >
  Execute Ansible lint

parameters:
  molecule-role-test:
    description: >
      Install the current repository at CIRCLE_SHA1 as an Ansible role before
      linting. Molecule requirements are installed independently of this flag.
    default: false
    type: boolean
  molecule-playbook-test:
    description: >
      Install roles from roles/requirements.yml before linting.
      Molecule requirements are installed independently of this flag.
    default: false
    type: boolean

steps:
  - run:
      name: Show Ansible lint version
      command: |
        ansible-lint --version
  - run:
      name: Show Ansible version
      command: |
        ansible --version
        ansible-community --version
  - run:
      name: Install the role and dependent roles for Molecule tests
      command: <<include(scripts/install-molecule-test-roles.sh)>>
      environment:
        PARAM_MOLECULE_ROLE_TEST: << parameters.molecule-role-test >>
        PARAM_MOLECULE_PLAYBOOK_TEST: << parameters.molecule-playbook-test >>
  - run:
      name: Execute Ansible lint
      command: ansible-lint
